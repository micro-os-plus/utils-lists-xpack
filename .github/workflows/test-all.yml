# https://micro-os-plus.github.io/utils-lists-xpack/
# https://github.com/micro-os-plus/utils-lists-xpack/actions/workflows/test-ci.yml

# Workflow for running some tests on each Push.
name: Run all tests

# https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions
# https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows

on:
  # Runs on manual triggering.
  workflow_dispatch:

jobs:
  ci-test:
    name: 'All µOS++ C++ intrusive lists tests'

    runs-on:  ${{ matrix.os }}

    strategy:
      matrix:
        # https://docs.github.com/en/actions/using-github-hosted-runners/using-github-hosted-runners/about-github-hosted-runners
        os: [ 'ubuntu-24.04', 'ubuntu-22.04', 'ubuntu-24.04-arm', 'ubuntu-22.04-arm', 'macos-13', 'macos-14', 'windows-2022', 'windows-2019' ]
        # https://nodejs.org/en - use LTS
        node-version: [ '20' ]
        # https://www.npmjs.com/package/xpm
        xpm-version: [ '0.20.7' ]

    steps:
    - name: Checkout
      # https://github.com/actions/checkout/
      uses: actions/checkout@v4
      with:
        fetch-depth: 3

    - name: Setup Node.js ${{ matrix.node-version }} on ${{ matrix.os }}
      # https://github.com/actions/setup-node
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Install xpm@${{ matrix.xpm-version }} on ${{ matrix.os }}
      run: npm install -g xpm@${{ matrix.xpm-version }}

    - name: Show environment
      run: |
        id
        uname -a
        node --version
        npm --version
        xpm --version
        env | sort

    - name: Satisfy project dependencies on ${{ matrix.os }}
      run: |
        npm ci -C tests
        xpm run install-all -C tests

    - name: Clean xPack cache Linux
      if: runner.os == 'Linux'
      run: |
        rm -rf "${HOME}/.cache/xPacks"

    - name: Clean xPack cache macOS
      if: runner.os == 'macOS'
      run: |
        rm -rf "${HOME}/Library/Caches/xPacks"

    - name: Clean xPack cache Windows
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        Remove-Item -LiteralPath "$env:LOCALAPPDATA\Caches\xPacks" -Force -Recurse

    - name: Run tests on ${{ matrix.os }}
      run: xpm run test-all -C tests
      env:
          CI: true
